services:
  postgres:
    image: postgres:17.12-bookworm@sha256:1eff563f6c868b9b433566e9f3cf6e5c79fbd3b95bf70ec7277d376cdbfc50d7
    environment:
      POSTGRES_DB: ${BASE_DB_NAME:-base_ielts}
      POSTGRES_USER: ${BASE_DB_BOOTSTRAP_USER:?set BASE_DB_BOOTSTRAP_USER}
      POSTGRES_PASSWORD: ${BASE_DB_BOOTSTRAP_PASSWORD:?set a local bootstrap password}
    ports:
      - "127.0.0.1:${BASE_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
